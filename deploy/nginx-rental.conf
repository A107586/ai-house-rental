# nginx 站点配置样例（大连智租）。
#
#   sudo cp deploy/nginx-rental.conf /etc/nginx/sites-available/rental
#   sudo ln -s /etc/nginx/sites-available/rental /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书用 certbot 签：
#   sudo certbot --nginx -d rent.example.com
#
# 这份配置里有三处是**踩过才知道要写**的，都在对应位置注明了。

# 给智能体接口单独开一个限流桶：它后面接着按次计费的大模型。
# 10m 的共享内存约能记 16 万个 IP；每秒 1 次、允许瞬时攒 5 次。
limit_req_zone $binary_remote_addr zone=agent_zone:10m rate=1r/s;
# 登录接口也单开一个：应用内的限流是**进程内计数**，
# 多 worker 之后每个进程各记各的，等于阈值被放大 N 倍。
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name rent.example.com;
    # 证书签好之后，80 只用来跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rent.example.com;

    ssl_certificate     /etc/letsencrypt/live/rent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rent.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 房源图片最大 5MB（应用侧同样卡 5MB），留一点余量
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---------------------------------------------------------------- 业务后端
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # **这一行与应用里的 TRUSTED_PROXY_HOPS=1 是一对。**
        # 它展开成「客户端发来的内容, $remote_addr」——左边那截是
        # 客户端自己写的，右边才是 nginx 亲眼看到的地址。
        # 应用从右边数第一段，所以伪造不了。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 接口文档（/docs、/redoc、/openapi.json）。
    #
    # **留着还是关掉，是一个要自己决定的取舍**：
    # 留着，评审可以直接点开试接口；关掉，攻击者少一份现成的接口地图。
    # 演示站建议留着；真开放给用户时把下面这段的注释去掉，
    # 用口令挡住（htpasswd -c /etc/nginx/.htpasswd 某个用户名）。
    #
    # location ~ ^/(docs|redoc|openapi\.json) {
    #     auth_basic "restricted";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # 登录单独限流，理由见文件开头
    location = /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------- 智能体
    #
    # **智能体服务不直接对公网开端口**，只能从这里进来。
    # 它自己没有登录态（鉴权全在业务后端），8000 暴露出去等于把
    # 一个会花钱的接口摆在公网上。
    location /agent/ {
        limit_req zone=agent_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 大模型一轮要十几秒，线上实测中位 9.1 秒、p95 28 秒。
        # 默认 60 秒的读超时会把慢的那一批截断，表现为「助手没反应」。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 流式输出时必须关缓冲，否则 nginx 攒够一块才吐，
        # 首字延迟（N-02 要求 3 秒内）就不成立了
        proxy_buffering off;
    }

    # ---------------------------------------------------------------- 静态
    # 上传的图片。直接由 nginx 发，不必经过应用。
    location /static/ {
        alias /srv/rental/server/static/;
        expires 7d;
        access_log off;
        # 上传目录里只该有图片。**不允许当成脚本执行**，
        # 也不要让浏览器去猜类型。
        add_header X-Content-Type-Options nosniff always;
    }

    # ---------------------------------------------------------------- 前端
    # 打包产物直接由 nginx 发；找不到的路径回落到 index.html（前端路由）
    root /srv/rental/web/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
