# 持续集成（CI）：每次推送代码或提 Pull Request，GitHub 自动在一台干净的 Linux 机器上
# 把下面几件事做一遍。任何一步失败，PR 页面上就会显示红叉，合并前就能发现改坏了什么。
#
# 本地跑同样的检查：
#   cd server && python -m unittest discover -s tests
#   cd agent  && python -m unittest discover -s tests -t .
#   cd web    && npm ci && npm run build
#   docker compose up -d --build

name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "docs/**"]
  pull_request:

# 同一个分支连推几次，只跑最新那次，前面没跑完的取消掉
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: 业务后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: unittest
        working-directory: server
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests

  agent-tests:
    name: 智能体测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r agent/requirements.txt
      - name: unittest
        working-directory: agent
        # 测试全部离线：仓库里没有 agent/.env，没配模型密钥，智能体自然不连大模型
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t .

  web-build:
    name: 前端打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web

  docker:
    name: Docker 构建与冒烟测试
    runs-on: ubuntu-latest
    needs: [server-tests, agent-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: 构建并启动
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: 两个服务都要答得上来
        run: |
          curl -fsS http://localhost:8080/health
          echo
          curl -fsS http://localhost:8000/health
          echo
          # 页面由后端直接提供：首页要是 HTML，不是「还没有前端构建产物」的提示
          curl -fsS http://localhost:8080/ | grep -qi "<!doctype html"
          # 演示数据要已经生成
          curl -fsS http://localhost:8080/health | grep -q '"seeded": *true'
      - name: 失败时打印日志
        if: failure()
        run: docker compose logs --no-color
      - name: 清理
        if: always()
        run: docker compose down -v
